name: "NEXRAD Radar Loop"
version: "1.2.2"
slug: "nexrad_radar_loop"
description: "Self-hosted live NEXRAD radar loop (county/state/province map lines, storm-track forecast lines, live lightning strikes) for any US radar site and location, sized for a Lovelace iframe card"
arch:
  - amd64
startup: application
boot: auto
homeassistant_api: true
ports:
  8600/tcp: 8600
ports_description:
  8600/tcp: "Radar loop web UI (point a Lovelace iframe card at this)"
options:
  radar_site: "DTX"
  home_latitude: 0.0
  home_longitude: 0.0
  local_width_km: 220
  timezone: "America/New_York"
schema:
  radar_site: "str"
  home_latitude: "float"
  home_longitude: "float"
  local_width_km: "float(50,500)"
  timezone: "str"
